# XcodeGen spec for LanVid Monitor (iOS). Generate the project:
#   ./scripts/build_core.sh                 # LanVidCore.xcframework (once / after core changes)
#   xcodegen generate                        # -> LanVidMonitor.xcodeproj
name: LanVidMonitor
options:
  bundleIdPrefix: com.manul02
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.6.0"
    # Build number: Fastlane / CI passes CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER (unique per upload)
    CURRENT_PROJECT_VERSION: "260"
targets:
  LanVidMonitor:
    type: application
    platform: iOS
    sources:
      - path: LanVidMonitor
    dependencies:
      - framework: build/LanVidCore.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: Network.framework
      - sdk: CoreMIDI.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manul02.lanvid.monitor
        PRODUCT_NAME: LanVid Monitor
        OTHER_LDFLAGS: ["-lc++"]
        # iPhone only (no iPad screenshots / multitasking requirements at submission)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: LanVidMonitor/Info.plist
      properties:
        CFBundleDisplayName: LanVid Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, uk]
        UIBackgroundModes: [audio]
        # Localized variants live in LanVidMonitor/Resources/{en,uk}.lproj/InfoPlist.strings
        NSLocalNetworkUsageDescription: "LanVid Monitor connects to LanVid Studio on your local Wi-Fi network to find it and to receive your personal monitor mix."
        NSBonjourServices: [_lanvid._udp]
        ITSAppUsesNonExemptEncryption: false
