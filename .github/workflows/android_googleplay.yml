name: Android Google Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (internal | closed | production)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - closed
          - production

jobs:
  publish-google-play:
    name: Build Signed AAB & Upload to Google Play (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/android

      - name: Install Android NDK 28.2 & CMake 3.31
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.1" "platforms;android-35"

      - name: Decode Upload Keystore & Play Service Account JSON
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/lanvid-release.jks
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > mobile/android/play-service-account.json

      - name: Build Signed Release AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/lanvid-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then
            ./gradlew bundleRelease --no-daemon
          else
            gradle bundleRelease --no-daemon
          fi

      - name: Upload AAB Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: lanvid-monitor-aab-${{ inputs.track }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload to Google Play via Fastlane supply
        working-directory: mobile/android
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ github.workspace }}/mobile/android/play-service-account.json
        run: |
          bundle exec fastlane "${{ inputs.track }}" aab:app/build/outputs/bundle/release/app-release.aab

      - name: Cleanup sensitive key files
        if: always()
        run: |
          rm -f mobile/android/lanvid-release.jks mobile/android/play-service-account.json
