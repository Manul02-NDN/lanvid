name: Release Artifacts

# Tag push `v*` (or manual run) builds the LanVid Core SDK (Windows / Linux / Apple / Android) and the LanVid Camera
# Android APK, then - for tags - publishes a GitHub Release with the bilingual notes docs/RELEASE_NOTES_v<version>.md.
# (LanVid Camera iOS ships through App Store Connect: .github/workflows/ios_camera_appstore.yml.) The version is read from CMakeLists.txt
# (project(lanvid VERSION x.y.z)) and must match the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve & verify version
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          V="$(sed -n 's/^project(lanvid VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
          [ -n "$V" ] || { echo "Cannot read the project version from CMakeLists.txt" >&2; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Project version: $V (ref: $GITHUB_REF)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version v$V" >&2
            exit 1
          fi

  release-sdk-desktop:
    name: Release Core SDK (${{ matrix.os_name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            os_name: Windows
          - runner: ubuntu-24.04
            os_name: Linux
    env:
      V: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config
      - name: Build, test & package Core SDK
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ./build/lanvid_tests
          python sdk/build_sdk.py --verify-client
          cd dist && 7z a -tzip "LanVidSDK-v$V-${{ matrix.os_name }}.zip" "LanVidSDK-v$V" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: rel-sdk-${{ matrix.os_name }}
          path: dist/LanVidSDK-v${{ needs.version.outputs.v }}-${{ matrix.os_name }}.zip
          if-no-files-found: error

  release-apple:
    name: Release Apple SDK (LanVidCore.xcframework)
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install cmake ninja
      - name: Build LanVidCore.xcframework.zip
        run: |
          chmod +x sdk/apple/build_xcframework.sh
          ./sdk/apple/build_xcframework.sh
          (cd dist/apple && ditto -c -k --sequesterRsrc --keepParent LanVidCore.xcframework LanVidCore.xcframework.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: rel-apple
          path: dist/apple/LanVidCore.xcframework.zip
          if-no-files-found: error

  release-android:
    name: Release Android (LanVid Camera APK + SDK AAR)
    needs: version
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android NDK & CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER (ANDROID_HOME=$SDK_ROOT)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.1" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Configure Signing Keystore (Secret or Ephemeral Release Key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/lanvid-release.jks
          else
            keytool -genkeypair -v \
              -keystore android/lanvid-release.jks \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -alias lanvid -storepass lanvid2026 -keypass lanvid2026 \
              -dname "CN=LanVid Camera, OU=Release, O=LanVid, L=Kyiv, C=UA"
          fi

      - name: Build Android SDK AAR & LanVid Camera APK
        run: |
          (cd sdk/android && gradle --no-daemon exportAar)
          (cd android && gradle --no-daemon exportUniversalApk)
          mkdir -p dist/android
          cp android/LanVid-Android-universal.apk "dist/android/LanVid-Camera-v$V-android.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "dist/android/LanVid-Camera-v$V-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: |
            dist/android/LanVid-Camera-v${{ needs.version.outputs.v }}-android.apk
            dist/android/lanvid-sdk-${{ needs.version.outputs.v }}.aar
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - version
      - release-sdk-desktop
      - release-apple
      - release-android
    env:
      V: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging
          merge-multiple: true

      - name: Assemble release assets & checksums
        run: |
          mkdir -p release-assets
          cp release-staging/* release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh release-assets/

      - name: Prepare release notes
        run: |
          if [ -f "docs/RELEASE_NOTES_v$V.md" ]; then
            cp "docs/RELEASE_NOTES_v$V.md" release-notes.md
          else
            echo "LanVid v$V" > release-notes.md
          fi

      - name: Upload Final Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanvid-release-bundle
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LanVid v${{ needs.version.outputs.v }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/LanVidSDK-v${{ needs.version.outputs.v }}-Windows.zip
            release-assets/LanVidSDK-v${{ needs.version.outputs.v }}-Linux.zip
            release-assets/LanVidCore.xcframework.zip
            release-assets/lanvid-sdk-${{ needs.version.outputs.v }}.aar
            release-assets/LanVid-Camera-v${{ needs.version.outputs.v }}-android.apk
            release-assets/SHA256SUMS.txt
