name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Core, Studio GUI, Tests & SDK
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          .\build\lanvid_tests.exe
          python sdk/build_sdk.py --verify-client
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/build_windows_setup.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows
          path: |
            installer/windows/LanVid_Setup.exe
            dist/LanVidSDK-v1.0.0/
          if-no-files-found: error

  release-linux:
    name: Release Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libx11-dev libxrandr-dev libpipewire-0.3-dev \
            libavcodec-dev libavutil-dev

      - name: Build Core, Studio GUI, SDK & Linux Installer
        run: |
          chmod +x installer/linux/build_linux_packages.sh installer/linux/install_lanvid.sh
          ./installer/linux/build_linux_packages.sh
          python3 sdk/build_sdk.py --verify-client

      - uses: actions/upload-artifact@v4
        with:
          name: rel-linux
          path: |
            installer/linux/LanVid-Linux-x86_64.run
            dist/LanVidSDK-v1.0.0/lib/
          if-no-files-found: error

  release-macos-ios:
    name: Release macOS & iOS (Universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools & Build Universal .pkg, .dmg & XCFramework
        run: |
          brew install cmake ninja
          chmod +x sdk/apple/build_xcframework.sh sdk/apple/build_macos_pkg.sh \
                   sdk/apple/installer/scripts/preinstall sdk/apple/installer/scripts/postinstall
          ./sdk/apple/build_macos_pkg.sh
          cd sdk/apple && swift build

      - uses: actions/upload-artifact@v4
        with:
          name: rel-apple
          path: |
            dist/apple/LanVidSDK-v1.0.0-macOS.pkg
            dist/apple/LanVidSDK-v1.0.0-macOS.dmg
            dist/apple/LanVidCore.xcframework/
          if-no-files-found: error

  release-android:
    name: Release Android (APK + AAR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android NDK & CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER (ANDROID_HOME=$SDK_ROOT)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.1" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Configure Signing Keystore (Secret or Ephemeral Release Key)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/lanvid-release.jks
          else
            keytool -genkeypair -v \
              -keystore android/lanvid-release.jks \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -alias lanvid -storepass lanvid2026 -keypass lanvid2026 \
              -dname "CN=LanVid Studio, OU=Release, O=LanVid, L=Kyiv, C=UA"
          fi

      - name: Build Android AAR & Universal APK
        run: |
          (cd sdk/android && gradle --no-daemon exportAar)
          (cd android && gradle --no-daemon exportUniversalApk)
          cp android/LanVid-Android-universal.apk dist/android/LanVid-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: |
            dist/android/LanVid-Android.apk
            dist/android/lanvid-sdk-1.0.0.aar
          if-no-files-found: error

  publish-release:
    name: Assemble Universal SDK & Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - release-windows
      - release-linux
      - release-macos-ios
      - release-android
    steps:
      - uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging

      - name: Assemble Final Release Assets & LanVidSDK-Universal.zip
        run: |
          mkdir -p release-assets sdk-universal/windows sdk-universal/linux sdk-universal/apple sdk-universal/android

          # Individual platform installers & libraries
          cp release-staging/rel-windows/installer/windows/LanVid_Setup.exe release-assets/
          cp release-staging/rel-linux/installer/linux/LanVid-Linux-x86_64.run release-assets/
          cp release-staging/rel-apple/LanVidSDK-v1.0.0-macOS.pkg release-assets/
          cp release-staging/rel-apple/LanVidSDK-v1.0.0-macOS.dmg release-assets/
          cp release-staging/rel-android/LanVid-Android.apk release-assets/
          cp release-staging/rel-android/lanvid-sdk-1.0.0.aar release-assets/

          # Combine unified cross-platform LanVidSDK-Universal.zip
          cp -R release-staging/rel-windows/dist/LanVidSDK-v1.0.0/* sdk-universal/
          mkdir -p sdk-universal/windows/bin sdk-universal/windows/lib
          cp -R release-staging/rel-windows/dist/LanVidSDK-v1.0.0/bin/* sdk-universal/windows/bin/
          cp -R release-staging/rel-windows/dist/LanVidSDK-v1.0.0/lib/* sdk-universal/windows/lib/
          cp -R release-staging/rel-linux/dist/LanVidSDK-v1.0.0/lib/* sdk-universal/linux/
          cp -R release-staging/rel-apple/LanVidCore.xcframework sdk-universal/apple/
          cp release-staging/rel-android/lanvid-sdk-1.0.0.aar sdk-universal/android/

          (cd sdk-universal && zip -r -q ../release-assets/LanVidSDK-Universal.zip .)
          ls -lh release-assets/

      - name: Upload Final Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanvid-release-bundle
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/LanVid_Setup.exe
            release-assets/LanVid-Linux-x86_64.run
            release-assets/LanVidSDK-v1.0.0-macOS.pkg
            release-assets/LanVidSDK-v1.0.0-macOS.dmg
            release-assets/LanVid-Android.apk
            release-assets/lanvid-sdk-1.0.0.aar
            release-assets/LanVidSDK-Universal.zip
