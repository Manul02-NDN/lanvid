name: CI Build & Test

# LanVid Video SDK (v3.1.0) & CrossLink Audio SDK (v1.0.0)
# Verifies ALL 3 selectable component modes (VIDEO, AUDIO, ALL) on Windows / Linux / macOS,
# Apple XCFrameworks & SwiftPM (LanVidKit + CrossLinkKit), LanVid Camera iOS, and Android AARs + APK.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-windows:
    name: Core SDK - Windows (x64 AVX2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure, Build & Test (ALL = LanVid Video + CrossLink Audio)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANVID_SDK_COMPONENTS=ALL
          cmake --build build
          .\build\lanvid_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "lanvid_tests.exe failed (exit $LASTEXITCODE)" }
          .\build\crosslink_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "crosslink_tests.exe failed (exit $LASTEXITCODE)" }

      - name: Verify Selectable SDK Modes & External C++ Clients (video / audio / all)
        shell: pwsh
        run: |
          python sdk/build_sdk.py --protocol video --verify-client
          python sdk/build_sdk.py --protocol audio --verify-client
          python sdk/build_sdk.py --protocol all --verify-client

  core-linux:
    name: Core SDK - Linux (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libavcodec-dev libavutil-dev

      - name: Configure, Build & Test (ALL = LanVid Video + CrossLink Audio)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANVID_SDK_COMPONENTS=ALL
          cmake --build build --parallel "$(nproc)"
          ./build/lanvid_tests
          ./build/crosslink_tests

      - name: Verify Selectable SDK Modes & External C++ Clients (video / audio / all)
        run: |
          python3 sdk/build_sdk.py --protocol video --verify-client
          python3 sdk/build_sdk.py --protocol audio --verify-client
          python3 sdk/build_sdk.py --protocol all --verify-client

  core-macos-and-camera-ios:
    name: Core SDK - macOS + LanVid Camera iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja xcodegen

      - name: Configure, Build & Run Both Test Suites (arm64 NEON)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANVID_SDK_COMPONENTS=ALL
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
          ./build/lanvid_tests
          ./build/crosslink_tests

      - name: Verify Selectable SDK Modes & External C++ Clients (video / audio / all)
        run: |
          python3 sdk/build_sdk.py --protocol video --no-macos-pkg --verify-client
          python3 sdk/build_sdk.py --protocol audio --no-macos-pkg --verify-client
          python3 sdk/build_sdk.py --protocol all --no-macos-pkg --verify-client

      - name: Build Both Apple XCFrameworks (LanVidCore + CrossLinkCore)
        run: |
          chmod +x sdk/apple/build_xcframework.sh
          ./sdk/apple/build_xcframework.sh --protocol all

      - name: Verify Swift Package (LanVidKit + CrossLinkKit) Compilation
        run: |
          cd sdk/apple
          swift build

      - name: Build LanVid Camera (mobile/ios_camera) for iOS
        run: |
          cd mobile/ios_camera
          ./scripts/build_core.sh
          xcodegen generate
          xcodebuild -project LanVidCamera.xcodeproj -scheme LanVidCamera -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanvid-crosslink-apple
          path: |
            dist/apple/LanVidCore.xcframework/
            dist/apple/CrossLinkCore.xcframework/
          if-no-files-found: error

  camera-android:
    name: LanVid Camera Android + Split SDK AARs (ARM64 NEON)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android NDK & CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER (ANDROID_HOME=$SDK_ROOT)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;35.0.1" "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Generate Ephemeral CI Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/lanvid-release.jks \
            -keyalg RSA -keysize 2048 -validity 365 \
            -alias lanvid -storepass lanvid2026 -keypass lanvid2026 \
            -dname "CN=LanVid CI, OU=CI, O=LanVid, L=Kyiv, C=UA"

      - name: Build Both Android SDK AARs (LanVid Video + CrossLink Audio)
        run: |
          cd sdk/android
          gradle --no-daemon :lanvid-sdk:exportAar :crosslink-sdk:exportAar

      - name: Build LanVid Camera Android (.apk)
        run: |
          cd android
          gradle --no-daemon exportUniversalApk
          mkdir -p ../dist/android
          cp LanVid-Android-universal.apk ../dist/android/LanVid-Camera-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanvid-crosslink-android
          path: |
            dist/android/lanvid-video-sdk-*.aar
            dist/android/crosslink-audio-sdk-*.aar
            dist/android/LanVid-Camera-Android.apk
          if-no-files-found: error
