name: iOS App Store / TestFlight (LanVid Monitor)

# Manual run only: Actions -> "iOS App Store / TestFlight (LanVid Monitor)" -> Run workflow.
#   target = testflight                 builds a signed .ipa and uploads it to TestFlight
#   target = appstore, skip_build=true  attaches the latest existing TestFlight build, uploads screenshots/metadata & submits (fast, no Xcode rebuild)
#   target = appstore, skip_build=false builds a fresh .ipa + uploads screenshots/metadata
#   submit_for_review                   (appstore only) also submits the version to App Review
# Needs three repository secrets (see mobile/ios/APPSTORE_SETUP.md):
#   APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to upload'
        type: choice
        options:
          - testflight
          - appstore
        default: appstore
      skip_build:
        description: 'Skip Xcode build and use latest existing TestFlight build (appstore only)'
        type: boolean
        default: true
      submit_for_review:
        description: 'Submit for App Review (appstore only)'
        type: boolean
        default: true

concurrency:
  group: ios-monitor-${{ inputs.target }}-${{ inputs.skip_build }}
  cancel-in-progress: false

jobs:
  publish-existing:
    if: ${{ inputs.target == 'appstore' && inputs.skip_build }}
    name: Publish existing TestFlight build to App Store (LanVid Monitor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
      REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
      REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          for v in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing - see mobile/ios/APPSTORE_SETUP.md"
            exit 1
          fi

      - name: Restore the App Store Connect API key (.p8)
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_BASE64"]))' "$KEY"
          chmod 600 "$KEY"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Fastlane publish_existing_build (App Store Connect)
        working-directory: mobile/ios
        run: bundle exec fastlane publish_existing_build submit:${{ inputs.submit_for_review }}

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  ios:
    if: ${{ inputs.target == 'testflight' || !inputs.skip_build }}
    name: Build & upload (${{ inputs.target }})
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
      REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
      REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          for v in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing - see mobile/ios/APPSTORE_SETUP.md"
            exit 1
          fi

      - name: Restore the App Store Connect API key (.p8)
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_BASE64"]))' "$KEY"
          chmod 600 "$KEY"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Install tools
        run: brew install cmake ninja xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Build LanVidCore.xcframework (libopus included)
        run: |
          chmod +x mobile/ios/scripts/build_core.sh
          ./mobile/ios/scripts/build_core.sh

      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Fastlane beta (TestFlight)
        if: ${{ inputs.target == 'testflight' }}
        working-directory: mobile/ios
        run: bundle exec fastlane beta

      - name: Fastlane release (App Store Connect)
        if: ${{ inputs.target == 'appstore' }}
        working-directory: mobile/ios
        run: bundle exec fastlane release submit:${{ inputs.submit_for_review }} skip_build:false

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Keep the signed .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LanVidMonitor-ipa
          path: mobile/ios/build/ipa/*.ipa
          if-no-files-found: ignore
